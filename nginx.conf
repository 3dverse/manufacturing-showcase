user nginx;
worker_processes auto;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"ts":"$time_iso8601","remote_addr":"$remote_addr","remote_user":"$remote_user","request":"$request","status": "$status","bytes_sent":"$bytes_sent","request_time":"$request_time","http_referrer":"$http_referer","http_user_agent":"$http_user_agent"}';
    log_format text '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout json;
    error_log /dev/stderr error;

    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    keepalive_timeout 65;
    sendfile on;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/index.html $uri.html $uri/ =404;
            add_header Referrer-Policy "same-origin";
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "DENY";
            add_header X-XSS-Protection "1; mode=block";
        }

        location ~ ^\/static\/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~ \.(html?)$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        error_page 403 =404 /404.html;
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200;
        }
    }
}
