openapi: 3.1.0
info:
  title: Dataset API
  version: 0.1.0
  description: >
    Manages in-memory manufacturing datasets. One dataset is generated per
    3dverse scene at startup. Datasets can be inspected and regenerated at
    runtime without restarting the server.
servers:
  - url: /-/api/dataset

tags:
  - name: DATASET
    description: Dataset lifecycle and metadata

paths:

  /:
    get:
      tags: [DATASET]
      operationId: listDatasets
      summary: List all loaded datasets
      description: >
        Returns metadata for every dataset currently held in memory,
        one entry per 3dverse scene.
      responses:
        '200':
          description: List of loaded datasets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sites:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasetMeta'
                required: [sites]

  /meta:
    get:
      tags: [DATASET]
      operationId: getDatasetMeta
      summary: Get metadata for a dataset
      description: >
        When called with ?siteId returns metadata for that specific site.
        When called without a parameter returns metadata for all sites.
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: string
          description: Scene/site ID. Omit to get all sites.
      responses:
        '200':
          description: Dataset metadata.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DatasetMeta'
                  - type: object
                    properties:
                      sites:
                        type: array
                        items:
                          $ref: '#/components/schemas/DatasetMeta'
                    required: [sites]

  /regenerate:
    post:
      tags: [DATASET]
      operationId: regenerateDatasets
      summary: Regenerate one or all datasets
      description: >
        Triggers dataset regeneration at runtime. If siteId is provided,
        only that scene's dataset is regenerated from its 3dverse scene graph.
        Otherwise all scenes are reloaded from the folder and regenerated.
      parameters:
        - name: siteId
          in: query
          required: false
          schema:
            type: string
          description: >
            Scene ID to regenerate. Omit to regenerate all scenes from the folder.
      responses:
        '200':
          description: Regeneration result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  regenerated:
                    type: array
                    items:
                      $ref: '#/components/schemas/DatasetMeta'
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        sceneId:
                          type: string
                        message:
                          type: string
                required: [regenerated, errors]

  /bom/{itemId}:
    get:
      tags: [DATASET]
      operationId: getBOM
      summary: Get the full BOM tree for an item
      description: >
        Returns the recursive Bill of Materials tree rooted at a finished good.
        Each node carries the item identifier, its type (finished_good, wip, or
        raw_material), the routing step that produces it, and its input children.
        Raw material leaves have no children and no producing step.
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: Finished good item identifier (e.g. FG-a1b2c3d4).
        - name: siteId
          in: query
          required: true
          schema:
            type: string
          description: Site whose dataset to query.
      responses:
        '200':
          description: BOM tree for the requested item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BOMNode'
                required: [data]
        '404':
          description: Item not found in the dataset for the given site.

  /graph:
    get:
      tags: [DATASET]
      operationId: getFactoryGraph
      summary: Load raw factory graph from a scene
      description: >
        Fetches the 3dverse scene and returns the parsed factory graph
        (hierarchy of areas, lines, cells, machines). Useful for debugging
        the scene structure without triggering a full regeneration.
      parameters:
        - name: sceneId
          in: query
          required: true
          schema:
            type: string
          description: The 3dverse scene asset ID.
      responses:
        '200':
          description: Factory graph.
          content:
            application/json:
              schema:
                type: object
                properties:
                  graph:
                    type: object
                    description: Hierarchical factory node tree.
        '400':
          description: Missing sceneId parameter.

components:
  schemas:
    BOMProducingStep:
      type: object
      additionalProperties: false
      description: The routing step that produces a BOM node's item. Absent for raw material leaves.
      properties:
        sequence:
          type: integer
          description: Execution order of this step within the routing.
          example: 20
        operationCode:
          type: string
          description: Operation identifier code.
          example: ASM-20
        operationType:
          type: string
          enum: [transformation, assembly, quality_control]
          description: >
            Material flow classification of the operation.
            transformation — 1 input is modified into 1 new WIP.
            assembly — N inputs are combined into 1 output.
            quality_control — passthrough, same item in and out.
        workCenterOperationType:
          type: string
          description: Work center capability type used to execute this step.
          example: ASSEMBLY
      required: [sequence, operationCode, operationType, workCenterOperationType]

    BOMNode:
      type: object
      additionalProperties: false
      description: >
        A node in the Bill of Materials tree. The root is the finished good;
        children are the items consumed to produce it, recursively down to
        raw material leaves. Children have the same shape as this object.
      properties:
        itemId:
          type: string
          description: Item identifier.
          example: FG-a1b2c3d4
        itemType:
          type: string
          enum: [finished_good, wip, raw_material]
          description: Classification of the item in the material flow.
        producedBy:
          $ref: '#/components/schemas/BOMProducingStep'
        children:
          type: array
          description: Input items consumed to produce this node's item (same shape as BOMNode).
          items:
            type: object
      required: [itemId, itemType, children]

    DatasetMeta:
      type: object
      properties:
        sceneId:
          type: string
          description: The 3dverse scene asset ID used as the dataset key.
        siteId:
          type: string
          description: The site identifier stored inside the dataset (equals sceneId).
        now:
          type: integer
          description: Unix timestamp (seconds) of the dataset's reference "now".
      required: [sceneId, siteId, now]
