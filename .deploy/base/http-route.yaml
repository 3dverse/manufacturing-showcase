---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manufacturing-showcase
spec:
  hostnames:
    - manufacturing.3dverse.xxx
  parentRefs:
    - name: gateway-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: manufacturing-showcase
          port: 3000
