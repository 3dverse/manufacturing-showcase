---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manufacturing-showcase
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: manufacturing-showcase
          image: registry.gitlab.com/3dverse/showcase/microverses/manufacturing-showcase:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ops
              containerPort: 3001
              protocol: TCP
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: ops
            initialDelaySeconds: 3
            failureThreshold: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: ops
            initialDelaySeconds: 3
            failureThreshold: 3
            periodSeconds: 10
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      imagePullSecrets:
        - name: gitlab-regcreds
      restartPolicy: Always
